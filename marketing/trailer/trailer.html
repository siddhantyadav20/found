<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raakh trailer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* One 1080×1920 frame of the trailer, drawn by renderAt(t) from edit.json
     (render.mjs injects it as window.EDIT, with any footage it found). The
     picture is WebGL (scenes.js: footage, or a drawn stand-in, through POST);
     the words are HTML over it, in the game's own type: Newsreader for the
     cards, Inter Tight for names, IBM Plex Mono for labels, one ember dot.
     Sized to be read on a phone with the sound off. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { --ember: #ff7a45; --t1: #f7f8f8; --t2: #a8a29a; color: var(--t1); font-family: "Inter Tight", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  #gl { width: 1080px; height: 1920px; }

  #missed { display: none; text-align: center; font-family: Inter, sans-serif; }
  #missed .n { position: absolute; left: 0; right: 0; top: 920px; }
  #missed b { display: block; font-size: 52px; font-weight: 600; color: #fff; }
  #missed span { display: block; margin-top: 6px; font-size: 36px; color: rgba(255,255,255,.7); }

  /* Cards: a serif line, on black or over the picture (lower middle, clear of
     Reels' caption and buttons, on a shadow of their own). */
  #card { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  #card.black { background: #000; }
  #card.over { justify-content: flex-end; padding-bottom: 560px;
    background: linear-gradient(transparent 42%, rgba(0,0,0,.66) 58%, rgba(0,0,0,.66) 78%, transparent 92%); }
  #card.over.mid { justify-content: center; padding-bottom: 0;
    background: linear-gradient(transparent 30%, rgba(0,0,0,.6) 42%, rgba(0,0,0,.6) 58%, transparent 70%); }
  .main { font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 92px; line-height: 1.12; letter-spacing: -.015em; text-shadow: 0 4px 40px rgba(0,0,0,.85); }
  .ember { font-family: Newsreader, Georgia, serif; font-style: italic; font-weight: 500; font-size: 92px; line-height: 1.12; letter-spacing: -.015em; color: var(--ember); margin-top: 6px; }
  .small { margin-top: 26px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; color: var(--t2); }
  .message { width: 100%; text-align: center; font-family: Inter, sans-serif; }
  .message small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 28px; letter-spacing: .12em; color: rgba(247,248,248,.55); margin-bottom: 34px; }
  .message .bubble { display: inline-block; padding: 44px 70px; border-radius: 72px 72px 72px 18px; background: #262628; font-size: 120px; font-weight: 500; color: #fff; }
  .message .dots { display: inline-flex; gap: 22px; padding: 60px 70px; border-radius: 72px 72px 72px 18px; background: #262628; }
  .message .dots i { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.55); }
  .message .tr { display: block; margin-top: 34px; font-family: Newsreader, serif; font-style: italic; font-size: 48px; color: var(--t2); }

  /* Labels: where and when, mono, an ember dot first. */
  #label { display: none; position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500;
    font-size: 34px; letter-spacing: .12em; text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  #label i { display: inline-block; width: 16px; height: 16px; margin-right: 18px; border-radius: 50%; background: var(--ember); vertical-align: 2px; box-shadow: 0 0 18px var(--ember); }

  /* Subtitles: who's speaking, then what they said, in English. */
  #sub { display: none; position: absolute; left: 70px; right: 70px; bottom: 470px; text-align: center; }
  #sub.top { top: 270px; bottom: auto; }
  #sub.mid { top: 1080px; bottom: auto; }
  #sub.foot { bottom: 330px; }
  #sub small { display: block; margin-bottom: 16px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: .14em; color: var(--ember); text-shadow: 0 2px 14px rgba(0,0,0,.9); }
  #sub span { display: inline; padding: 6px 18px; font-weight: 600; font-size: 54px; line-height: 1.5; letter-spacing: -.01em; color: #fff;
    background: rgba(0,0,0,.55); box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  #type { display: none; align-items: center; justify-content: center; text-align: center; white-space: pre-line; padding: 0 60px; }
  #type .stamp { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 124px; letter-spacing: .02em; text-shadow: 0 0 50px rgba(0,0,0,.8); }
  #type .typed { font-family: Inter, sans-serif; font-weight: 600; font-size: 92px; padding: 30px 46px; background: rgba(0,0,0,.55); border-radius: 18px; }
  #type .cursor { display: inline-block; width: 8px; height: 92px; margin-left: 8px; vertical-align: -14px; background: #e8b730; }

  /* The title, as the site sets it. */
  #title { display: none; text-align: center; }
  #title > * { position: absolute; left: 0; right: 0; }
  #title .mark { top: 560px; display: flex; justify-content: center; align-items: center; gap: 22px; font-weight: 600; font-size: 52px; letter-spacing: -.035em; }
  #title .mark svg { width: 36px; height: 54px; overflow: visible; }
  #title .chapter { top: 700px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: .2em; color: var(--ember); }
  #title h1 { top: 735px; font-weight: 500; font-size: 270px; line-height: 1.1; letter-spacing: -.04em; text-shadow: 0 0 80px rgba(0,0,0,.6); }
  #title .tag { top: 1060px; font-family: Newsreader, serif; font-style: italic; font-weight: 400; font-size: 54px; color: rgba(247,248,248,.85); }
  #title .cta { top: 1210px; left: 50%; right: auto; transform: translateX(-50%); white-space: nowrap; padding: 24px 46px; border-radius: 80px; background: var(--ember); color: #160a04;
    font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: .08em; }
  #title .fine { top: 1340px; font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: .08em; color: rgba(247,248,248,.42); }

  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: 90px; background: #000; }
  #bars::before { top: 0; } #bars::after { bottom: 0; }
  #black { background: #000; opacity: 0; }
</style>
</head>
<body>
<canvas class="layer" id="gl" width="1080" height="1920"></canvas>
<div class="layer" id="missed"><div class="n"><b>47 Missed Calls</b><span>+91 62••• •••••</span></div></div>
<div class="layer" id="type"></div>
<div id="label"></div>
<div id="sub"></div>
<div class="layer" id="card"></div>
<div class="layer" id="title">
  <div class="mark"><svg viewBox="0 0 24 36" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="33" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="4.5" y="5" width="15" height="24" rx="2.4" fill="currentColor" opacity=".14"/><rect x="7" y="10" width="10" height="2.2" rx="1.1" fill="currentColor" opacity=".85"/><rect x="7" y="14.4" width="6.5" height="2.2" rx="1.1" fill="currentColor" opacity=".85"/><circle cx="21" cy="4" r="3.4" fill="#e8613a" stroke="#000" stroke-width="2"/></svg>Found</div>
  <div class="chapter">CHAPTER 01 · DELHI</div>
  <h1>Raakh</h1>
  <div class="tag">A thriller you play on someone else's phone.</div>
  <div class="cta">PLAY FREE · FOUND-GAME.VERCEL.APP</div>
  <div class="fine">16+ · GUN VIOLENCE, A MISSING PERSON, A FIRE</div>
</div>
<div class="layer" id="black"></div>
<div class="layer" id="bars"></div>

<script type="module">
import { fragments, POST } from "./scenes.js";

const E = window.EDIT;
const FOOT = window.FOOTAGE || {};
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const smooth = (x) => x * x * (3 - 2 * x);

// ---- GL: each scene renders into a half-float buffer; POST grades it to the canvas.
const SW = 720, SH = 1280;
const gl = $("gl").getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
gl.getExtension("EXT_color_buffer_float");
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0, 1); }`;
function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + "\n" + src.split("\n").slice(0, 3).join("\n"));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER)); gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const progs = {};
for (const [k, src] of Object.entries(fragments)) {
  try { progs[k] = program(src); } catch (e) { throw new Error(`scene ${k}: ${e.message}`); }
}
const post = program(POST);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texStorage2D(gl.TEXTURE_2D, 1 + Math.floor(Math.log2(SH)), gl.RGBA16F, SW, SH);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const fbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
// Footage goes in its own texture and through the same POST.
const ftex = gl.createTexture();

const footFrames = {};
async function footImage(src) {
  if (!footFrames[src]) { const img = new Image(); img.src = src; await img.decode(); footFrames[src] = img; }
  return footFrames[src];
}

// The camera taking a hit: decaying shake from each of E.shakes.
function shakeAt(t) {
  let a = 0;
  for (const s of E.shakes || []) if (t >= s.t) a += s.amp * Math.exp(-(t - s.t) * s.decay);
  return [a * (Math.sin(t * 83) * .6 + Math.sin(t * 137 + 1) * .4), a * (Math.sin(t * 71 + 2) * .6 + Math.sin(t * 151) * .4)];
}

async function drawPicture(s, t, frame, flash, shake) {
  let source = tex;
  const f = FOOT[s.slot];
  if (f) {
    const uses = E.shots.filter((x) => x.slot === s.slot);
    const offset = Math.floor(uses.indexOf(s) * f.frames / Math.max(1, uses.length));
    const i = (offset + Math.floor((t - s.t0) * E.fps)) % f.frames;
    const img = await footImage(`${f.dir}/${String(i + 1).padStart(5, "0")}.jpg`);
    gl.bindTexture(gl.TEXTURE_2D, ftex);
    // Images load top row first; GL textures start at the bottom.
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    source = ftex;
  } else {
    const pr = progs[s.scene];
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, SW, SH);
    gl.useProgram(pr.p);
    gl.uniform2f(pr.u.R, SW, SH);
    gl.uniform1f(pr.u.T, t); gl.uniform1f(pr.u.L, t - s.t0); gl.uniform1f(pr.u.D, s.t1 - s.t0); gl.uniform1f(pr.u.S, s.seed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.generateMipmap(gl.TEXTURE_2D);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, 1080, 1920);
  gl.useProgram(post.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, source);
  gl.uniform1i(post.u.S, 0);
  gl.uniform2f(post.u.OUTR, 1080, 1920);
  gl.uniform1f(post.u.T, t);
  gl.uniform1f(post.u.flash, flash);
  gl.uniform1f(post.u.exposure, s.exposure);
  gl.uniform1f(post.u.foot, f ? 1 : 0);
  gl.uniform1f(post.u.warmth, s.warmth);
  gl.uniform1f(post.u.sat_, s.sat);
  gl.uniform1f(post.u.haze, s.haze || 0);
  gl.uniform1f(post.u.streak, s.streak || 0);
  gl.uniform2f(post.u.shake, shake[0] * .012, shake[1] * .008);
  gl.uniform1f(post.u.seed, frame % 97);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function blank(flash) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, 1080, 1920);
  gl.clearColor(flash, flash, flash, 1); gl.clear(gl.COLOR_BUFFER_BIT);
}

// ---- words
function drawCard(t) {
  const c = E.cards.find((x) => t >= x.t0 && t < x.t1 && x.style !== "title");
  const el = $("card");
  if (!c) { el.style.display = "none"; return null; }
  el.style.display = "flex";
  el.className = "layer" + (c.over ? " over" : " black") + (c.pos === "mid" ? " mid" : "");
  if (c.style === "message") {
    // Typing… then the message, and what it means.
    const typing = t < c.t0 + .8;
    const k = typing ? "dots" : "msg";
    if (el.dataset.key !== `${c.t0}${k}`) {
      el.dataset.key = `${c.t0}${k}`;
      el.innerHTML = `<div class="message"><small>UNKNOWN NUMBER · 2%</small>${typing ? `<span class="dots"><i></i><i></i><i></i></span>`
        : `<span class="bubble">${c.lines[0][0]}</span><span class="tr">${c.lines[1] ? c.lines[1][0] : ""}</span>`}</div>`;
    }
    const inner = el.firstElementChild;
    inner.style.opacity = smooth(ramp(t, c.t0, c.t0 + .2)) * (1 - smooth(ramp(t, c.t1 - .35, c.t1)));
    if (typing) el.querySelectorAll(".dots i").forEach((d, i) => { d.style.opacity = .35 + .65 * (Math.sin((t - c.t0) * 12 - i * 1.2) * .5 + .5); });
    else {
      const p = ease(ramp(t, c.t0 + .8, c.t0 + 1.05));
      const bub = el.querySelector(".bubble");
      bub.style.transform = `scale(${.85 + .15 * p})`; bub.style.transformOrigin = "50% 100%";
      el.querySelector(".tr").style.opacity = smooth(ramp(t, c.t0 + 1.2, c.t0 + 1.6));
    }
    return c;
  }
  if (el.dataset.key !== String(c.t0)) {
    el.dataset.key = c.t0;
    el.innerHTML = `<div>${c.lines.map(([text, kind]) => `<div class="${kind}">${text.replace(/\n/g, "<br>")}</div>`).join("")}</div>`;
  }
  const inner = el.firstElementChild;
  const pin = smooth(ramp(t, c.t0 + .05, c.t0 + .55)), pout = smooth(ramp(t, c.t1 - .35, c.t1));
  inner.style.opacity = pin * (1 - pout);
  inner.style.filter = `blur(${(1 - pin) * 12 + pout * 6}px)`;
  inner.style.transform = `translateY(${(1 - pin) * 18}px) scale(${1.02 - pin * .02 + ramp(t, c.t0, c.t1) * .03})`;
  // Later lines arrive a beat after the first.
  [...inner.children].slice(1).forEach((line, i) => { line.style.opacity = smooth(ramp(t, c.t0 + .7 + i * .4, c.t0 + 1.2 + i * .4)); });
  return c;
}

function drawLabel(t) {
  const l = (E.labels || []).find((x) => t >= x.t0 && t < x.t1);
  const el = $("label");
  el.style.display = l ? "block" : "none";
  if (!l) return;
  if (el.dataset.key !== String(l.t0)) { el.dataset.key = l.t0; el.innerHTML = `<i></i>${l.text}`; }
  el.style.opacity = smooth(ramp(t, l.t0, l.t0 + .3)) * (1 - smooth(ramp(t, l.t1 - .25, l.t1)));
}

function drawSub(t) {
  const s = (E.subs || []).find((x) => t >= x.t0 && t < x.t1);
  const el = $("sub");
  el.style.display = s ? "block" : "none";
  if (!s) return;
  if (el.dataset.key !== String(s.t0)) { el.dataset.key = s.t0; el.className = s.pos || ""; el.innerHTML = `${s.who ? `<small>${s.who}</small>` : ""}<span>${s.text}</span>`; }
  el.style.opacity = smooth(ramp(t, s.t0, s.t0 + .12)) * (1 - smooth(ramp(t, s.t1 - .15, s.t1)));
}

function drawType(t) {
  const ty = E.type.find((x) => t >= x.t0 && t < x.t1);
  const el = $("type");
  el.style.display = ty ? "flex" : "none";
  if (!ty) return;
  if (ty.kind === "typed") {
    // Typed out, one key at a time, to where it stops; the cursor keeps blinking.
    const n = Math.floor(clamp((t - ty.t0) / .45) * ty.text.length);
    const blink = Math.floor((t - ty.t0) * 3) % 2 === 0 || n < ty.text.length;
    el.innerHTML = `<div class="typed">${ty.text.slice(0, n)}<span class="cursor" style="opacity:${blink ? 1 : 0}"></span></div>`;
  } else {
    el.innerHTML = `<div class="stamp">${ty.text}</div>`;
    el.firstElementChild.style.opacity = 1 - ramp(t, ty.t1 - .05, ty.t1);
  }
}

function drawTitle(t) {
  const c = E.cards.find((x) => x.style === "title");
  const on = t >= c.t0;
  $("title").style.display = on ? "block" : "none";
  if (!on) return;
  for (const [sel, d] of [["h1", 0], [".chapter", .35], [".mark", .6], [".tag", 1.2], [".cta", 1.9], [".fine", 2.4]]) {
    const el = $("title").querySelector(sel);
    const p = smooth(ramp(t, c.t0 + d, c.t0 + d + .8));
    el.style.opacity = p; el.style.filter = `blur(${(1 - p) * 10}px)`;
  }
  const h = $("title").querySelector("h1");
  const ph = ease(ramp(t, c.t0, c.t0 + 1.6));
  h.style.letterSpacing = `${.12 - ph * .16}em`;
  h.style.transform = `scale(${1.08 - .08 * ph})`;
  $("title").style.opacity = 1 - ramp(t, c.t1 - .3, c.t1);
}

window.renderAt = async function (t) {
  const frame = Math.round(t * E.fps);
  // Flashes: a white frame; the gunshot's also burns off slowly.
  const fl = E.flashes.find((x) => t >= x.t && t < x.t + x.d + (x.d > .05 ? .25 : 0));
  const flash = fl ? (t < fl.t + fl.d ? fl.k : fl.k * (1 - ramp(t, fl.t + fl.d, fl.t + fl.d + .25))) : 0;
  const silent = E.silence.some(([a, b]) => t >= a && t < b);
  const s = silent ? null : E.shots.find((x) => t >= x.t0 && t < x.t1);
  const card = drawCard(t);
  const shake = shakeAt(t);
  if (s && !(card && !card.over)) await drawPicture(s, t, frame, flash, shake); else blank(flash);

  // A breath of black around the longer shots; the quick ones cut hard.
  let dip = 0;
  if (s && s.t1 - s.t0 > 1.5) dip = Math.max(1 - ramp(t, s.t0, s.t0 + .2), ramp(t, s.t1 - .12, s.t1));
  if (t < .25) dip = Math.max(dip, 1 - ramp(t, 0, .25));
  $("black").style.opacity = dip;

  // The notification, for the drawn stand-in only (footage carries its own).
  const m = s && !FOOT[s.slot] && s.scene === "screen";
  $("missed").style.display = m ? "block" : "none";
  if (m) {
    const L = t - s.t0, fp = smooth(ramp(L, .2, 1.4));
    $("missed").style.filter = `blur(${(1 - fp) * 14}px)`;
    $("missed").style.opacity = .35 + fp * .65;
  }
  drawType(t);
  drawLabel(t);
  drawSub(t);
  drawTitle(t);
  const words = `translate(${shake[0] * 10}px, ${shake[1] * 8}px)`;
  $("card").style.transform = words; $("type").style.transform = words; $("sub").style.transform = words;
};
window.ready = true;
</script>
</body>
</html>
