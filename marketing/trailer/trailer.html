<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shagun trailer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* One 1080×1920 frame of the trailer, drawn by renderAt(t) from edit.json
     (render.mjs injects it as window.EDIT, with any footage it found). The
     picture is WebGL (scenes.js); the words are HTML over it. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { color: #f4efe8; font-family: Archivo, Inter, sans-serif; font-stretch: 125%; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  #gl { width: 1080px; height: 1920px; }

  #missed { display: none; text-align: center; font-family: Inter, sans-serif; font-stretch: 100%; }
  #missed .n { position: absolute; left: 0; right: 0; top: 920px; }
  #missed b { display: block; font-size: 52px; font-weight: 600; color: #fff; }
  #missed span { display: block; margin-top: 6px; font-size: 36px; color: rgba(255,255,255,.7); }

  #card { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #card.black { background: #000; }
  #card.over { justify-content: flex-end; padding-bottom: 470px; }
  .place { font-weight: 300; font-size: 30px; letter-spacing: .5em; line-height: 2.2; margin-right: -.5em; color: rgba(244,239,232,.9); text-shadow: 0 0 30px rgba(0,0,0,.9); }
  .line { white-space: nowrap; font-weight: 500; font-size: 42px; letter-spacing: .2em; line-height: 1.5; margin-right: -.2em; text-shadow: 0 0 30px rgba(0,0,0,.9); }
  .message { font-family: Inter, sans-serif; font-stretch: 100%; font-size: 64px; }
  .message small { display: block; font-family: Archivo, sans-serif; font-stretch: 125%; font-size: 22px; letter-spacing: .5em; color: rgba(244,239,232,.45); margin-bottom: 34px; }
  #type { display: none; align-items: center; justify-content: center; text-align: center; white-space: pre-line;
    font-weight: 700; font-size: 74px; letter-spacing: .14em; line-height: 1.2; padding: 0 60px; text-shadow: 0 0 40px rgba(0,0,0,.7); }

  #title { display: none; text-align: center; }
  #title .found { position: absolute; left: 0; right: 0; top: 640px; font-weight: 300; font-size: 26px; letter-spacing: .8em; color: #e8a25b; margin-right: -.8em; }
  #title .hi { position: absolute; left: 0; right: 0; top: 700px; font-family: Hind, sans-serif; font-stretch: 100%; font-weight: 300; font-size: 52px; letter-spacing: .3em; color: rgba(244,239,232,.6); }
  #title h1 { position: absolute; left: 0; right: 0; top: 820px; font-weight: 700; font-size: 128px; letter-spacing: .2em; margin-right: -.2em; }
  #title .what { position: absolute; left: 0; right: 0; top: 1050px; font-weight: 300; font-size: 26px; letter-spacing: .38em; line-height: 2; color: rgba(244,239,232,.8); margin-right: -.38em; }
  #title .rule { position: absolute; left: 50%; top: 1270px; width: 120px; height: 2px; margin-left: -60px; background: rgba(244,239,232,.35); }
  #title .cta { position: absolute; left: 0; right: 0; top: 1300px; font-weight: 500; font-size: 30px; letter-spacing: .42em; margin-right: -.42em; }
  #title .fine { position: absolute; left: 0; right: 0; top: 1400px; font-weight: 300; font-size: 20px; letter-spacing: .3em; color: rgba(244,239,232,.4); }

  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: 90px; background: #000; }
  #bars::before { top: 0; } #bars::after { bottom: 0; }
  #black { background: #000; opacity: 0; }
</style>
</head>
<body>
<canvas class="layer" id="gl" width="1080" height="1920"></canvas>
<div class="layer" id="missed"><div class="n"><b>47 Missed Calls</b><span>+91 62••• •••••</span></div></div>
<div class="layer" id="type"></div>
<div class="layer" id="card"></div>
<div class="layer" id="title">
  <div class="found">FOUND · CHAPTER ONE</div>
  <div class="hi">शगुन</div>
  <h1>SHAGUN</h1>
  <div class="what">A MYSTERY YOU PLAY<br>ON A STRANGER'S PHONE</div>
  <div class="rule"></div>
  <div class="cta">PLAY FREE · LINK IN BIO</div>
  <div class="fine">16+ · NOTHING GRAPHIC IS SHOWN</div>
</div>
<div class="layer" id="black"></div>
<div class="layer" id="bars"></div>

<script type="module">
import { fragments, POST } from "./scenes.js";

const E = window.EDIT;
const FOOT = window.FOOTAGE || {};
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const smooth = (x) => x * x * (3 - 2 * x);

// ---- GL: each scene renders into a half-float buffer; POST grades it to the canvas.
const SW = 720, SH = 1280;
const gl = $("gl").getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
gl.getExtension("EXT_color_buffer_float");
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0, 1); }`;
function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + "\n" + src.split("\n").slice(0, 3).join("\n"));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER)); gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const progs = {};
for (const [k, src] of Object.entries(fragments)) {
  try { progs[k] = program(src); } catch (e) { throw new Error(`scene ${k}: ${e.message}`); }
}
const post = program(POST);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texStorage2D(gl.TEXTURE_2D, 1 + Math.floor(Math.log2(SH)), gl.RGBA16F, SW, SH);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const fbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
// Footage, when there is some, goes in its own texture and through the same POST.
const ftex = gl.createTexture();

const footFrames = {};
async function footImage(src) {
  if (!footFrames[src]) { const img = new Image(); img.src = src; await img.decode(); footFrames[src] = img; }
  return footFrames[src];
}

async function drawPicture(s, t, frame, flash) {
  let source = tex;
  const f = FOOT[s.slot];
  if (f) {
    const uses = E.shots.filter((x) => x.slot === s.slot);
    const offset = Math.floor(uses.indexOf(s) * f.frames / Math.max(1, uses.length));
    const i = (offset + Math.floor((t - s.t0) * E.fps)) % f.frames;
    const img = await footImage(`${f.dir}/${String(i + 1).padStart(5, "0")}.jpg`);
    gl.bindTexture(gl.TEXTURE_2D, ftex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    source = ftex;
  } else {
    const pr = progs[s.scene];
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, SW, SH);
    gl.useProgram(pr.p);
    gl.uniform2f(pr.u.R, SW, SH);
    gl.uniform1f(pr.u.T, t); gl.uniform1f(pr.u.L, t - s.t0); gl.uniform1f(pr.u.D, s.t1 - s.t0); gl.uniform1f(pr.u.S, s.seed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.generateMipmap(gl.TEXTURE_2D);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, 1080, 1920);
  gl.useProgram(post.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, source);
  gl.uniform1i(post.u.S, 0);
  gl.uniform2f(post.u.OUTR, 1080, 1920);
  gl.uniform1f(post.u.T, t);
  gl.uniform1f(post.u.flash, flash);
  gl.uniform1f(post.u.exposure, s.exposure * (f ? .9 : 1));
  gl.uniform1f(post.u.warmth, s.warmth);
  gl.uniform1f(post.u.sat_, s.sat);
  gl.uniform1f(post.u.seed, frame % 97);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function blank(flash) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, 1080, 1920);
  gl.clearColor(flash, flash, flash, 1); gl.clear(gl.COLOR_BUFFER_BIT);
}

// ---- words
function drawCard(t) {
  const c = E.cards.find((x) => t >= x.t0 && t < x.t1 && x.style !== "title");
  const el = $("card");
  if (!c) { el.style.display = "none"; return null; }
  el.style.display = "flex";
  el.className = "layer" + (c.over ? " over" : " black");
  if (el.dataset.key !== String(c.t0)) {
    el.dataset.key = c.t0;
    el.innerHTML = c.style === "message"
      ? `<div class="message"><small>UNKNOWN NUMBER · 2%</small>${c.lines[0]}</div>`
      : `<div class="${c.style}">${c.lines.join("<br>")}</div>`;
  }
  const inner = el.firstElementChild;
  const pin = smooth(ramp(t, c.t0 + .1, c.t0 + .9)), pout = smooth(ramp(t, c.t1 - .45, c.t1));
  inner.style.opacity = pin * (1 - pout);
  inner.style.filter = `blur(${(1 - pin) * 10 + pout * 6}px)`;
  inner.style.transform = `scale(${1.03 - pin * .03 + ramp(t, c.t0, c.t1) * .02})`;
  return c;
}

function drawTitle(t) {
  const c = E.cards.find((x) => x.style === "title");
  const on = t >= c.t0;
  $("title").style.display = on ? "block" : "none";
  if (!on) return;
  for (const [sel, d] of [[".found", .2], [".hi", .6], ["h1", 0], [".what", 1.6], [".rule", 2.2], [".cta", 2.4], [".fine", 2.9]]) {
    const el = $("title").querySelector(sel);
    const p = smooth(ramp(t, c.t0 + d, c.t0 + d + .9));
    el.style.opacity = p; el.style.filter = `blur(${(1 - p) * 8}px)`;
  }
  const h = $("title").querySelector("h1");
  const ph = ease(ramp(t, c.t0, c.t0 + 1.4));
  h.style.letterSpacing = `${.6 - ph * .4}em`; h.style.marginRight = `${-(.6 - ph * .4)}em`;
}

window.renderAt = async function (t) {
  const frame = Math.round(t * E.fps);
  const fl = E.flashes.find((x) => t >= x.t && t < x.t + x.d + .15);
  const flash = fl ? (t < fl.t + fl.d ? 1 : 1 - ramp(t, fl.t + fl.d, fl.t + fl.d + .15)) : 0;
  const silent = E.silence.some(([a, b]) => t >= a && t < b);
  const s = silent ? null : E.shots.find((x) => t >= x.t0 && t < x.t1);
  const card = drawCard(t);
  if (s && !(card && !card.over)) await drawPicture(s, t, frame, flash); else blank(flash);

  // A breath of black at each cut that isn't part of the montage.
  let dip = 0;
  if (s && s.t1 - s.t0 > .9) dip = Math.max(1 - ramp(t, s.t0, s.t0 + .25), ramp(t, s.t1 - .15, s.t1));
  if (t < .6) dip = Math.max(dip, 1 - ramp(t, 0, .6));
  $("black").style.opacity = dip;

  // The notification, held in the same hand as the picture.
  const m = s && s.scene === "screen" && !FOOT[s.slot];
  $("missed").style.display = m ? "block" : "none";
  if (m) {
    const L = t - s.t0, fp = smooth(ramp(L, .2, 1.4));
    const hx = (Math.sin(L * 1.3) * .006 + Math.sin(L * 3.1) * .002) * 1920, hy = Math.cos(L * 1.1) * .005 * 1920;
    $("missed").style.transform = `translate(${-hx}px, ${hy}px)`;
    $("missed").style.filter = `blur(${(1 - fp) * 14}px)`;
    $("missed").style.opacity = .35 + fp * .65;
  }
  const ty = E.type.find((x) => t >= x.t0 && t < x.t1);
  $("type").style.display = ty ? "flex" : "none";
  if (ty) { $("type").textContent = ty.text; $("type").style.opacity = 1 - ramp(t, ty.t1 - .06, ty.t1); }
  drawTitle(t);
};
window.ready = true;
</script>
</body>
</html>
