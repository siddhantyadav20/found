<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050506;font-family:Geist,sans-serif;color:#f3efe6}
  #desk{position:absolute;inset:0;background:
    radial-gradient(ellipse 62% 70% at 50% 58%, #121113 0%, #0a0a0b 55%, #040405 100%)}
  #glow{position:absolute;width:1600px;height:1100px;left:0;top:0;transform:translate(-800px,-550px);border-radius:50%;pointer-events:none;filter:blur(40px)}
  #full{position:absolute;inset:0;overflow:hidden}
  #full img.pic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:cover}
  #phone{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .bezel{position:relative;width:456px;height:960px;border-radius:70px;background:#09090b;box-shadow:inset 0 0 0 2px #26262b,inset 0 0 0 4px #0c0c0e,0 40px 90px rgba(0,0,0,.65),0 6px 18px rgba(0,0,0,.5)}
  #screen{position:absolute;left:12px;top:12px;width:432px;height:936px;border-radius:58px;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",Inter,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  .island{position:absolute;left:50%;top:22px;width:116px;height:34px;margin-left:-58px;border-radius:20px;background:#000;z-index:30}
  /* status bar */
  .sb{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;box-sizing:border-box;font-size:17px;font-weight:600;z-index:20;letter-spacing:-.2px}
  .sb .r{display:flex;align-items:center;gap:7px}
  .sig{display:flex;align-items:flex-end;gap:1.5px;height:12px}.sig i{display:block;width:3px;background:#fff;border-radius:1px}
  .wifi{width:16px;height:12px;fill:#fff}
  .bat{position:relative;width:30px;height:14px;border:1.5px solid rgba(255,255,255,.5);border-radius:5px;box-sizing:border-box}
  .bat:after{content:"";position:absolute;right:-5px;top:3px;width:2px;height:5px;background:rgba(255,255,255,.5);border-radius:1px}
  .bat b{position:absolute;left:1px;top:1px;bottom:1px;border-radius:3px;background:#f5c518;min-width:3px}
  .bat b.red{background:#ff453a}
  .bat span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;mix-blend-mode:normal}
  .bat.lo span{color:#fff}
  /* lock */
  .lock{position:absolute;inset:0;background:#000}
  .lock .wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .lock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.0) 30%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.5))}
  .lock .day{position:absolute;left:0;right:0;top:86px;text-align:center;font-size:22px;font-weight:500;letter-spacing:-.1px}
  .lock .clock{position:absolute;left:0;right:0;top:106px;text-align:center;font-family:-apple-system,"SF Pro Display",Inter,sans-serif;font-size:104px;font-weight:700;letter-spacing:-3px;line-height:1}
  .notes{position:absolute;left:14px;right:14px;bottom:88px;display:flex;flex-direction:column;gap:9px}
  .note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(54,54,60,.62);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
  .note .bd{flex:1;min-width:0}
  .note .ic{flex:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .note .ic svg{width:24px;height:24px;fill:#fff}
  .ic.icphone{background:#30d158}.ic.icwa{background:#25d366}
  .note .from{font-size:16px;font-weight:600;line-height:1.3}
  .note .txt{font-size:16px;line-height:1.3;color:#fff}
  .note .en{font-size:13px;line-height:1.3;color:rgba(235,235,245,.6);margin-top:1px}
  .note .when{margin-left:auto;font-size:13px;color:rgba(235,235,245,.6);flex:none}
  .lock .bottom{position:absolute;left:0;right:0;bottom:28px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
  .lock .round{width:50px;height:50px;border-radius:50%;background:rgba(40,40,46,.7);display:flex;align-items:center;justify-content:center}
  .lock .round svg{width:22px;height:22px;fill:#fff}
  .lock .swipe{font-size:15px;color:rgba(255,255,255,.75)}
  .banner{position:absolute;left:12px;right:12px;top:64px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:30px;background:rgba(44,44,50,.92);backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.08);z-index:40}
  .banner .av{width:40px;height:40px;border-radius:50%;background:#8e8e93;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .banner .av svg{width:26px;height:26px;fill:#f2f2f7}
  .banner .who{flex:1;line-height:1.2}
  .banner .who b{display:block;font-size:16px;font-weight:600}
  .banner .who span{font-size:13px;color:rgba(235,235,245,.6)}
  .banner .btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .banner .btn svg{width:22px;height:22px;fill:#fff}
  .btn.red{background:#ff3b30}.btn.green{background:#34c759}
  /* call */
  .call{position:absolute;inset:0;background:#000}
  .call .wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.35) saturate(.7);transform:scale(1.2)}
  .call .name{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:30px;font-weight:500;letter-spacing:-.3px}
  .call .sub{position:absolute;left:0;right:0;top:162px;text-align:center;font-size:17px;color:rgba(235,235,245,.7);font-variant-numeric:tabular-nums}
  .call .grid{position:absolute;left:34px;right:34px;bottom:190px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px 10px}
  .call .k{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.85)}
  .call .k i{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
  .call .end{position:absolute;left:50%;bottom:72px;width:76px;height:76px;margin-left:-38px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center}
  .call .end svg{width:34px;height:34px;fill:#fff;transform:rotate(135deg)}
  .call .av{position:absolute;left:50%;top:230px;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:#636366;display:flex;align-items:center;justify-content:center}
  .call .av svg{width:70px;height:70px;fill:#f2f2f7}
  .incoming .name{top:150px;font-size:36px}
  .incoming .sub{top:200px}
  .incoming .two{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:space-around;padding:0 30px}
  .incoming .two div{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,.85)}
  .incoming .two i{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .incoming .two i svg{width:36px;height:36px;fill:#fff}
  .incoming .small{position:absolute;left:0;right:0;bottom:190px;display:flex;justify-content:space-around;padding:0 40px;font-size:13px;color:rgba(255,255,255,.8)}
  .incoming .small div{display:flex;flex-direction:column;align-items:center;gap:8px}
  .incoming .small i{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
  /* instagram */
  .ig{position:absolute;inset:0;background:#000;padding-top:56px}
  .ig .top{height:50px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;position:relative}
  .ig .top .back{position:absolute;left:18px;top:14px;width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2}
  .ig .top .dots{position:absolute;right:18px;top:22px;font-size:20px;letter-spacing:2px;line-height:0}
  .ig .user{display:flex;align-items:center;gap:12px;padding:8px 14px 10px}
  .ig .user img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #000,0 0 0 4px #c93b7d}
  .ig .user b{font-size:15px;font-weight:600}
  .ig .user .dots{margin-left:auto;font-size:20px;letter-spacing:2px;line-height:0}
  .ig .photo{width:432px;height:347px;object-fit:cover;display:block}
  .ig .acts{display:flex;gap:16px;padding:12px 14px 6px}
  .ig .acts svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .ig .acts .save{margin-left:auto}
  .ig .likes{padding:0 14px;font-size:15px;font-weight:600}
  .ig .cap{padding:4px 14px 0;font-size:15px;line-height:1.35}
  .ig .cap b{font-weight:600;margin-right:6px}
  .ig .ago{padding:6px 14px;font-size:13px;color:#8e8e93}
  /* whatsapp media viewer */
  .mv{position:absolute;inset:0;background:#000}
  .mv .bar{position:absolute;left:0;right:0;top:56px;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:5}
  .mv .bar svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2}
  .mv .bar b{display:block;font-size:17px;font-weight:600;line-height:1.2}
  .mv .bar span{display:block;font-size:13px;color:rgba(235,235,245,.65)}
  .mv img.v{position:absolute;left:0;top:84px;width:432px;height:768px;object-fit:cover}
  .mv .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 34px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.75) 40%);font-size:16px;line-height:1.35}
  .mv .cap span{display:block;font-size:13px;color:rgba(235,235,245,.65)}
  /* whatsapp chat */
  .wa{position:absolute;inset:0;background:#070809;display:flex;flex-direction:column}
  .wa .hdr{flex:none;height:112px;padding:62px 14px 0 14px;display:flex;align-items:center;gap:10px;background:rgba(18,18,20,.98);box-sizing:border-box;border-bottom:.5px solid rgba(255,255,255,.08)}
  .wa .hdr .back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none}
  .wa .hdr .back svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4}
  .wa .hdr .av{width:38px;height:38px;border-radius:50%;background:#636366;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
  .wa .hdr .av img{width:100%;height:100%;object-fit:cover}
  .wa .hdr .av svg{width:24px;height:24px;fill:#f2f2f7}
  .wa .hdr .who{flex:1;min-width:0;line-height:1.2}
  .wa .hdr .who b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa .hdr .who span{display:block;font-size:12px;color:rgba(235,235,245,.6)}
  .wa .hdr .acts{flex:none;display:flex;gap:18px;padding:9px 14px;border-radius:22px;background:rgba(255,255,255,.1)}
  .wa .hdr .acts svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linejoin:round}
  .wa .body{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.025) 0 10px,transparent 11px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.02) 0 8px,transparent 9px),
    radial-gradient(circle at 45% 85%,rgba(255,255,255,.02) 0 9px,transparent 10px);background-size:140px 160px}
  .wa .msgs{position:absolute;left:0;right:0;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
  .wa .msgs[data-align=bottom]{bottom:0}
  .wa .msgs[data-align=top]{top:0}
  .pill{align-self:center;padding:5px 12px;border-radius:12px;background:#1e2022;font-size:13px;color:rgba(235,235,245,.75);margin:6px 0}
  .pill.sys{text-align:center;line-height:1.35;max-width:320px;background:#1b1f1e;color:#c9c0a0;font-size:12.5px}
  .b{position:relative;max-width:330px;padding:8px 12px 7px;border-radius:14px;font-size:16.5px;line-height:1.3;box-shadow:0 1px 1px rgba(0,0,0,.3)}
  .b.in{align-self:flex-start;background:#1f2123;border-top-left-radius:4px}
  .b.out{align-self:flex-end;background:#0f4b3a;border-top-right-radius:4px}
  .b .en{display:block;margin-top:3px;font-size:14px;line-height:1.3;color:rgba(235,235,245,.6)}
  .b .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:3px;font-size:12px;color:rgba(235,235,245,.55)}
  .b .meta svg{width:16px;height:11px;fill:none;stroke:#8e9598;stroke-width:1.8}
  .b .meta svg.blue{stroke:#53bdeb}
  .b .fwd{display:flex;align-items:center;gap:5px;font-size:12.5px;font-style:italic;color:rgba(235,235,245,.5);margin-bottom:6px}
  .b .fwd svg{width:14px;height:14px;fill:rgba(235,235,245,.5)}
  /* LAPATA poster */
  .poster{width:300px;padding:16px 14px 14px;background:#fbf8f1;color:#1b1b1b;box-shadow:inset 0 0 0 3px #c4161c,inset 0 0 0 5px #fbf8f1,inset 0 0 0 6px #c4161c;text-align:center;font-family:-apple-system,"SF Pro Text",Inter,sans-serif}
  .poster .hi{font-family:"Devanagari MT","Kohinoor Devanagari","Noto Serif Devanagari",serif;font-size:46px;line-height:1.05;color:#c4161c;font-weight:700;margin-top:4px}
  .poster .lp{font-size:12px;letter-spacing:.22em;color:#c4161c;font-weight:700;margin:4px 0 12px}
  .poster img{width:136px;height:164px;object-fit:cover;border:2px solid #1b1b1b;display:block;margin:0 auto 12px;filter:grayscale(1) contrast(1.05)}
  .poster .nm{font-size:19px;font-weight:700;margin-bottom:6px}
  .poster .d{font-size:13px;line-height:1.5;color:#2b2b2b}
  .poster .ct{margin-top:12px;background:#c4161c;color:#fff;font-weight:700;font-size:13px;padding:8px 6px}
  /* voice note */
  .vn{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
  .vn .play{width:0;height:0;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px;flex:none}
  .vn .wave{position:relative;flex:1;height:26px;display:flex;align-items:center;gap:2px}
  .vn .wave i{display:block;width:2.5px;border-radius:2px;background:rgba(255,255,255,.4)}
  .vn .wave i.on{background:#e9edef}
  .vn .wave .dot{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;margin-left:-7px;border-radius:50%;background:#53bdeb;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  .vn .dur{font-size:13px;color:rgba(235,235,245,.6);font-variant-numeric:tabular-nums;width:34px;text-align:right}
  .tr{margin-top:6px;padding-top:8px;border-top:.5px solid rgba(255,255,255,.12);font-size:16px;line-height:1.3}
  .tr .en{display:block;margin-top:4px;font-size:14px;color:rgba(235,235,245,.6)}
  /* locked chats */
  .lc{position:absolute;inset:0;background:#000;padding-top:56px}
  .lc .back{margin:8px 14px 0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
  .lc .back svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4}
  .lc h1{margin:40px 18px 8px;font-size:34px;font-weight:700;letter-spacing:-.5px}
  .lc p{margin:0 18px 18px;font-size:15px;color:#8e8e93;line-height:1.35}
  .lc .row{display:flex;align-items:center;gap:14px;padding:12px 18px 0}
  .lc .row img{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none}
  .lc .row .r{flex:1;border-bottom:.5px solid rgba(255,255,255,.12);padding-bottom:12px}
  .lc .row .l1{display:flex;justify-content:space-between;font-size:17px;font-weight:600}
  .lc .row .l1 span{font-size:15px;font-weight:400;color:#8e8e93}
  .lc .row .l2{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:15px;color:#8e8e93}
  .lc .row .l2 svg{width:16px;height:11px;fill:none;stroke:#53bdeb;stroke-width:1.8}
  .lc .tabs{position:absolute;left:14px;right:14px;bottom:26px;height:72px;border-radius:36px;background:rgba(30,30,34,.9);display:flex;align-items:center;justify-content:space-around;font-size:11px;font-weight:600;color:#8e8e93}
  .lc .tabs div{display:flex;flex-direction:column;align-items:center;gap:5px}
  .lc .tabs i{width:24px;height:24px;border-radius:6px;background:#8e8e93;display:block;opacity:.7}
  .lc .tabs .on{color:#25d366}.lc .tabs .on i{background:#25d366;opacity:1}
  /* case file panel (full frame) */
  .cf{position:absolute;left:1124px;top:96px;width:700px;height:900px;color:#f2ede6}
  .cf h2{margin:0;font:600 30px/1.2 -apple-system,"SF Pro Display",Inter,sans-serif;letter-spacing:-.3px}
  .cf .where{margin:18px 0 26px;text-align:center;font:400 12px/1 "Geist Mono",monospace;letter-spacing:.06em;color:#8e8a82}
  .cf .cfcard{padding:26px 28px 24px;border-radius:14px;background:#0e0e10;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07)}
  .cf .eye{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.16em;color:#e8743b;text-transform:uppercase}
  .cf .q{margin:14px 0 10px;font:700 27px/1.25 Newsreader,Georgia,serif;letter-spacing:-.2px}
  .cf .look{font:400 15px/1.3 Geist,sans-serif;color:#8e8a82}
  .cf .sent{margin-top:22px;font:500 25px/1.75 Newsreader,Georgia,serif}
  .cf .blank{display:inline-block;min-width:64px;padding:0 10px;margin:0 4px;border-bottom:2px solid #e8743b;text-align:center;color:#cfc8ba;font-size:22px;vertical-align:baseline}
  .cf .blank.on{color:#fff;font-weight:700;font-size:25px;border-bottom-color:#e8743b}
  .cf .blank.sel{background:#3b2a24;border-radius:8px 8px 0 0}
  .cf .chips{display:flex;gap:10px;margin-top:16px}
  .cf .chip{padding:9px 14px;border-radius:12px;background:#17171a;font:400 15px/1 Geist,sans-serif;color:#e9e3d6;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
  .cf .foot{margin-top:22px;padding-top:18px;border-top:.5px solid rgba(255,255,255,.08)}
  .cf .foot .hint{font:400 14px/1.3 Geist,sans-serif;color:#8e8a82;margin-bottom:12px}
  .cf .btns{display:flex;gap:12px}
  .cf .btn{padding:14px 22px;border-radius:12px;font:500 16px/1 Geist,sans-serif;background:#17171a;color:#6e6a63}
  .cf .btn.on{background:#f2ede6;color:#111}
  .cf .btn.ghost{background:transparent;color:#f2ede6;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .cf .ans{margin-top:22px;padding-left:14px;border-left:3px solid #e8743b;font:400 16px/1.45 Newsreader,Georgia,serif;color:#e9e3d6}
  .cf .ans small{display:block;font:500 11px/1 "Geist Mono",monospace;letter-spacing:.14em;color:#8e8a82;margin-bottom:8px}
  /* cards, subs, title, end */
  #cards,#subs,#title{position:absolute;inset:0;pointer-events:none}
  .card{position:absolute;left:0;right:0;text-align:center;font:400 31px/1 Geist,sans-serif;letter-spacing:.46em;padding-left:.46em;text-transform:uppercase;white-space:nowrap;color:#f3efe6}
  .card.pic{top:884px;text-shadow:0 0 22px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.7)}
  .card.blk{top:524px}
  .sub{position:absolute;left:0;right:0;top:968px;text-align:center;font:400 33px/1.25 Geist,sans-serif;letter-spacing:.005em;color:#efe9dc;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.8)}
  .ttl{position:absolute;left:0;right:0;top:438px;text-align:center;font:300 176px/1 Geist,sans-serif;letter-spacing:.52em;padding-left:.52em;color:#f3efe6;text-shadow:0 0 40px rgba(0,0,0,.6)}
  .ch{position:absolute;left:0;right:0;top:668px;text-align:center;font:500 22px/1 "Geist Mono",monospace;letter-spacing:.6em;padding-left:.6em;color:#d8d2c4}
  #end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;pointer-events:none}
  #end svg{width:380px;height:auto;fill:#f3efe6}
  #end .t{font:italic 500 42px/1 Newsreader,Georgia,serif;letter-spacing:.005em;color:#e9e3d6}
  #end .l1{font:500 21px/1 "Geist Mono",monospace;letter-spacing:.42em;padding-left:.42em;color:#f3efe6}
