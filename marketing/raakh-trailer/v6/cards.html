<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
#c{position:absolute;inset:0;color:#f3efe6;font-family:Geist;text-align:center}
.pic,.blk{position:absolute;left:0;right:0;font:400 31px/1 Geist;letter-spacing:.46em;padding-left:.46em;text-transform:uppercase;white-space:nowrap}
.pic{top:842px;background:radial-gradient(ellipse 34% 120% at 50% 50%,rgba(0,0,0,.42),rgba(0,0,0,0) 70%);padding-top:22px;padding-bottom:22px;margin-top:-22px;text-shadow:0 0 22px rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.6)}
.blk{top:524px}
.title{position:absolute;left:0;right:0;top:438px;font:300 176px/1 Geist;letter-spacing:.52em;padding-left:.52em;text-shadow:0 0 40px rgba(0,0,0,.7)}
.ch{position:absolute;left:0;right:0;top:668px;font:500 22px/1 "Geist Mono";letter-spacing:.6em;padding-left:.6em;color:#d8d2c4;text-shadow:0 0 14px rgba(0,0,0,.8)}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
#end svg{width:400px;height:auto;fill:#f3efe6}
#end .t{font:italic 500 42px/1 Newsreader,Georgia,serif;letter-spacing:.005em;color:#e9e3d6}
#end .l1{font:500 22px/1 "Geist Mono";letter-spacing:.42em;padding-left:.42em;color:#f3efe6}
#end .l2{font:400 24px/1 "Geist Mono";letter-spacing:.12em;color:#a8a296}
</style></head><body><div id="c"></div>
<script type="module">
import {LOGO_VIEWBOX,LOGO_PATH} from "./logo.js";
const c=document.getElementById('c');
window.show=(kind,text)=>{
  if(kind==='title'){c.innerHTML=`<div class="title">RAAKH</div><div class="ch">${text}</div>`;}
  else if(kind==='end'){c.innerHTML=`<div id="end"><svg viewBox="${LOGO_VIEWBOX}"><path d="${LOGO_PATH}"/></svg><div class="t">A thriller you play on a phone.</div><div class="l1">CHAPTER ONE  ·  PLAY FREE IN YOUR BROWSER</div><div class="l2">found-game.vercel.app</div></div>`;}
  else {c.innerHTML=`<div class="${kind}">${text}</div>`;}
  return document.fonts.ready.then(()=>true);
};
window.ready=document.fonts.ready;
</script></body></html>
